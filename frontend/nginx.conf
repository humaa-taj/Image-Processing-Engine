# Serves the built React app and forwards /api to the backend container.
# "backend" is the docker-compose service name (Docker's internal DNS), so no localhost is involved.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 12m;          # uploads up to 10 MB (+ form overhead); the backend checks again

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Single-page app: unknown paths (e.g. /soft-moe on reload) return index.html.
    location / {
        try_files $uri /index.html;
    }

    # Built JS/CSS files have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
